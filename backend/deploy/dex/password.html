<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Teacher AI</title>
  <link rel="stylesheet" href="{{ url .ReqPath "static/classroom.css" }}">
</head>
<body>
  <main>
    <div class="brand"><span class="school" aria-hidden="true"></span>Teacher AI</div>
    <h1>Sign in</h1>
    <form method="post" action="{{ .PostURL }}">
      <label for="login">{{ .UsernamePrompt }}</label>
      <input id="login" name="login" autocomplete="username" autocapitalize="none"
        spellcheck="false" required value="{{ .Username }}" {{ if not .Username }}autofocus{{ end }}>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
        required {{ if .Invalid }}aria-describedby="login-error" autofocus{{ end }}>
      {{ if .Invalid }}<p id="login-error" role="alert">Check your email and password, then try again.</p>{{ end }}
      <button type="submit">Sign in</button>
    </form>
    {{ if .BackLink }}<a href="{{ .BackLink }}">Choose another sign-in method</a>{{ end }}
  </main>
</body>
</html>
